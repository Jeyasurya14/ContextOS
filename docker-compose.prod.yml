# docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: contextos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contextos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contextos

  redis:
    image: redis:7-alpine
    container_name: contextos-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contextos

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: contextos-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contextos

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextos-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contextos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contextos}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - contextos

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextos-celery-worker
    restart: always
    command: celery -A app.workers worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contextos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contextos}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - contextos

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextos-celery-beat
    restart: always
    command: celery -A app.workers beat --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - contextos

  nginx:
    image: nginx:1.25-alpine
    container_name: contextos-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - contextos

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  contextos:
    driver: bridge
