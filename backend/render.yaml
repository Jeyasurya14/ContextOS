services:
  - type: web
    name: contextos-api
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RENDER
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRONTEND_URL
        value: "https://contextos.learnmade.in"
      - key: BACKEND_URL
        value: "https://contextos-api-jxdr.onrender.com"
      - key: CORS_ORIGINS
        value: "https://contextos.learnmade.in,https://context-os-admin.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002"
      # Secrets — set these manually in Render dashboard (do NOT commit actual values):
      # DATABASE_URL, REDIS_URL, JWT_SECRET_KEY, ENCRYPTION_KEY,
      # OPENAI_API_KEY, GITHUB_CLIENT_SECRET, NOTION_CLIENT_SECRET,
      # SLACK_CLIENT_SECRET, RAZORPAY_KEY_SECRET, QDRANT_API_KEY
