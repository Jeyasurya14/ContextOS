<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContextOS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#f59e0b;--brand-l:#fbbf24;--brand-dim:rgba(245,158,11,.09);--brand-b:rgba(245,158,11,.2);
  --bg:#0b0b0e;--s1:#111115;--s2:#18181d;--s3:#222229;
  --fg:#e0e0d8;--fg2:#888890;--fg3:#3a3a42;
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.11);
  --err:#f87171;--ok:#34d399;--pu:#8b5cf6;
  --r:11px;--r2:7px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','Fira Code','Consolas',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:13px;line-height:1.6;color:var(--fg);background:var(--bg);display:flex;flex-direction:column;height:100vh}
#hdr,#msgs,#sbar,#ftr{position:relative;z-index:1}
#hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--bd);background:rgba(11,11,14,.95)}
.hdr-l{display:flex;align-items:center;gap:7px}
.logo-name{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,#f59e0b,#fbbf24 60%,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#clearBtn{background:transparent;border:1px solid var(--bd);color:var(--fg2);border-radius:var(--r2);padding:3px 8px;font-size:10px;font-family:var(--font);cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px 0 4px;display:flex;flex-direction:column}
.mg{padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.mg.user{flex-direction:row-reverse}
.mc{flex:1;min-width:0;max-width:calc(100% - 33px)}
.mg.user .mc{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.16);border-radius:10px 2px 10px 10px;padding:8px 11px}
#sbar{display:none}
#sbar.on{display:block;padding:7px 12px;font-size:10.5px;color:var(--fg2);background:rgba(11,11,14,.97);border-top:1px solid var(--bd)}
#ftr{flex-shrink:0;padding:8px 10px 10px;border-top:1px solid var(--bd);background:rgba(11,11,14,.97)}
.irow{position:relative;display:flex;align-items:flex-end;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r)}
textarea{flex:1;background:transparent;color:var(--fg);border:none;padding:9px 42px 9px 11px;font-family:var(--font);font-size:12.5px;resize:none;min-height:42px;max-height:148px;outline:none}
#sndBtn{position:absolute;right:6px;bottom:6px;width:28px;height:28px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sndBtn:disabled{opacity:.2;cursor:not-allowed}
.welcome{padding:20px 14px 10px;text-align:center}
.welcome h2{font-size:14.5px;font-weight:700;color:#fff;margin-bottom:5px}
.welcome p{font-size:11.5px;color:var(--fg2)}
</style>
</head>
<body>
<div id="hdr">
  <div class="hdr-l"><span class="logo-name">ContextOS</span></div>
  <button id="clearBtn">New chat</button>
</div>
<div id="msgs">
  <div class="welcome" id="welcome">
    <h2>ContextOS Assistant</h2>
    <p>Your project-aware AI assistant.</p>
  </div>
</div>
<div id="sbar"><div id="sbar-in"></div></div>
<div id="ftr">
  <div class="irow">
    <textarea id="inp" placeholder="Ask anything..." rows="1"></textarea>
    <button id="sndBtn">&#10148;</button>
  </div>
</div>
<script>
const vscode=acquireVsCodeApi();
const msgsEl=document.getElementById('msgs');
const inp=document.getElementById('inp');
const sndBtn=document.getElementById('sndBtn');
const sbar=document.getElementById('sbar');
const sbarIn=document.getElementById('sbar-in');
const clearBtn=document.getElementById('clearBtn');
let busy=false;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const scrollBot=()=>msgsEl.scrollTop=msgsEl.scrollHeight;
const lock=v=>{busy=v;sndBtn.disabled=v;inp.disabled=v};
const showStatus=label=>{sbar.classList.add('on');sbarIn.textContent=label};
const hideStatus=()=>{sbar.classList.remove('on');sbarIn.textContent=''};
const addUser=text=>{
  document.getElementById('welcome')?.remove();
  const g=document.createElement('div');
  g.className='mg user';
  g.innerHTML='<div class="mc">'+esc(text)+'</div>';
  msgsEl.appendChild(g);
  scrollBot();
};
const startBot=()=>{
  document.getElementById('welcome')?.remove();
  const g=document.createElement('div');
  g.className='mg bot';
  g.innerHTML='<div class="mc"><span class="cur">&#9614;</span></div>';
  msgsEl.appendChild(g);
  scrollBot();
  return g;
};
const finishBot=bot=>{
  if(bot){bot.innerHTML='<div class="mc">'+bot.innerText+'</div>';}
  scrollBot();
};
const send=()=>{
  const text=inp.value.trim();
  if(!text||busy)return;
  addUser(text);
  inp.value='';
  lock(true);
  vscode.postMessage({type:'prompt',value:text});
};
sndBtn.onclick=send;
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
clearBtn.onclick=()=>{msgsEl.innerHTML='<div class="welcome" id="welcome"><h2>ContextOS Assistant</h2><p>Your project-aware AI assistant.</p></div>';lock(false);vscode.postMessage({type:'clearHistory'});};
window.onmessage=m=>{
  if(m.data.type==='done'){lock(false);finishBot(document.querySelector('.mg.bot'));}
  if(m.data.type==='error'){lock(false);msgsEl.innerHTML+='<div class="mg err"><div class="mc">'+esc(m.data.value)+'</div></div>';}
  if(m.data.type==='token'){if(!document.querySelector('.mg.bot'))startBot();msgsEl.lastChild.innerHTML+=esc(m.data.content);}
};
vscode.postMessage({type:'ready'});
console.log('[Webview] Chat UI initialized');
</script>
</body>
</html>
